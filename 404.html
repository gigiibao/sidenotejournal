<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — side note</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FCFBF7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;800&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FCFBF7;--ink:#353535;--soft:#6a6a6a;--blue:#E5E9F2;--card-ink:#353535}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#262626;--ink:#FCFBF7;--soft:#bdbdbd}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:var(--bg);color:var(--ink);text-align:center;padding:2rem;
font:400 1.05rem/1.7 "Inter Tight",system-ui,sans-serif}
h1{font-family:Gaegu,"Inter Tight",system-ui,sans-serif;font-weight:700;line-height:1.1;
font-size:clamp(2.4rem,8vw,4rem);margin:0 0 1rem}
h1 span{display:inline-block;background:var(--blue);color:var(--card-ink);
padding:0 .25em;border-radius:.4em .6em .35em .55em;transform:rotate(-2deg)}
p{color:var(--soft);max-width:28rem;margin:0 auto 2rem}
a{display:inline-block;color:var(--card-ink);background:var(--blue);text-decoration:none;
font-weight:700;padding:.6rem 1.6rem;border:2.5px solid var(--card-ink);
border-radius:28px 36px 24px 40px;transition:transform .2s}
a:hover{transform:translateY(-3px) rotate(-2deg)}
</style>
</head>
<body>
<main>
<h1>This page <span>wandered off</span></h1>
<p>The address you tried doesn't exist here. It may have been a typo, or a link that changed.</p>
<a href="/">← Back to side note</a>
</main>
</body>
</html>

# Static site: no build step needed.
[build]
  publish = "."
  command = ""

# The site uses real paths (/blog, /our-story, ...) handled by the router in
# index.html, so each known route is served from index.html. Anything else is a
# genuine 404 — without this, every made-up URL would answer 200 with the home
# page and Google would treat the whole domain as duplicate content.
# Adding a page? Add its route here as well.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/blog/grades-and-confidence"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/blog/comparing-myself"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/blog/small-decisions"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/blog/lonely-with-friends"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/our-story"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/resources"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/student-voices"
  to = "/index.html"
  status = 200

# Trailing-slash forms of the routes above redirect to the canonical form, so a
# page never answers on two addresses. Google already discovered "/blog/" with
# the slash, so these must stay.
[[redirects]]
  from = "/blog/"
  to = "/blog"
  status = 301

[[redirects]]
  from = "/blog/grades-and-confidence/"
  to = "/blog/grades-and-confidence"
  status = 301

[[redirects]]
  from = "/blog/comparing-myself/"
  to = "/blog/comparing-myself"
  status = 301

[[redirects]]
  from = "/blog/small-decisions/"
  to = "/blog/small-decisions"
  status = 301

[[redirects]]
  from = "/blog/lonely-with-friends/"
  to = "/blog/lonely-with-friends"
  status = 301

[[redirects]]
  from = "/our-story/"
  to = "/our-story"
  status = 301

[[redirects]]
  from = "/resources/"
  to = "/resources"
  status = 301

[[redirects]]
  from = "/student-voices/"
  to = "/student-voices"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
